# FaceAttend configuration. Every key is optional; omitted keys use code defaults.
# Thresholds are STARTING POINTS for InsightFace buffalo_l (ArcFace R50, cosine
# similarity). Calibrate them on your own validation data with `faceattend evaluate`.

model:
  pack: buffalo_l              # SCRFD-10GF detector + ArcFace R50 (WebFace600K)
  root: ~/.insightface         # model download/cache directory
  providers: [CPUExecutionProvider]   # GPU: [CUDAExecutionProvider, CPUExecutionProvider]
  ctx_id: -1                   # -1 = CPU, 0 = first GPU
  det_size: [640, 640]

detection:
  confidence_threshold: 0.5
  nms_threshold: 0.4
  max_faces: 0                 # 0 = no limit

recognition:
  similarity_threshold: 0.45   # UNCALIBRATED starting point - run `faceattend evaluate`
  margin: 0.05                 # best identity must beat the runner-up by this much
  match_strategy: centroid     # centroid | max | topk_mean
  top_k: 3

enrollment_quality:            # strict: what gets stored
  min_face_size: 80
  min_det_score: 0.70
  min_blur_variance: 60.0
  min_brightness: 50.0
  max_brightness: 210.0
  min_contrast: 25.0
  max_yaw_deviation: 0.15
  max_roll_degrees: 15.0
  pitch_range: [0.30, 0.90]   # heuristic; smiles raise this ratio

recognition_quality:           # looser: what we attempt to recognise
  min_face_size: 48
  min_det_score: 0.55
  min_blur_variance: 25.0
  min_brightness: 35.0
  max_brightness: 225.0
  min_contrast: 15.0
  max_yaw_deviation: 0.25
  max_roll_degrees: 35.0       # alignment removes roll, so recognition tolerates more
  pitch_range: [0.25, 0.95]

enrollment:
  min_samples: 5
  target_samples: 8
  max_samples_per_person: 30
  duplicate_identity_threshold: 0.55
  consistency_threshold: 0.35
  near_duplicate_threshold: 0.97
  auto_capture_interval_s: 0.7
  store_aligned_crops: false   # embeddings only by default (data minimisation)

live:
  camera_index: 0
  backend: auto                # auto | dshow | msmf | v4l2 | avfoundation
  width: 1280
  height: 720
  recognize_every_n_frames: 5
  track_iou_threshold: 0.3
  track_max_missed: 10
  smoothing_window: 7
  min_votes: 4
  max_consecutive_read_failures: 30

storage:
  db_path: data/faceattend.db
  crops_dir: data/crops
  reports_dir: reports

security:
  require_admin_auth: true

logging:
  level: INFO
  file: logs/faceattend.log
